name: onramp
description: Watches your project's contributor funnel and nudges it back into motion when it stalls.
url: https://github.com/Bryandero98/onramp
public: true
default_events:
  - issues
  - pull_request
  - pull_request_review
default_permissions:
  issues: write
  pull_requests: write
  contents: read
  metadata: read
